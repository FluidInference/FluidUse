name: Swift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: CLI regression checks
        run: python3 Tools/test_laya_cli.py .build/release/FluidUseLaya
